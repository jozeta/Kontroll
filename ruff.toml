# ruff (app standards QA-LINT-1): syntax errors, pyflakes errors and the bandit security rules (S).
# Ruff 0.17+ enables a very broad default set, hence the explicit select.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "S"]

[lint.per-file-ignores]
"tests/**" = ["S101"]   # pytest uses assert
